name: Lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  hadolint:
    name: Hadolint (Dockerfiles)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          recursive: true
          # DL3008: pin apt versions — too noisy for example images
          # DL3015: --no-install-recommends — already used everywhere it matters
          ignore: DL3008,DL3015,DL3018
          failure-threshold: warning

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck
        uses: ludeeus/action-shellcheck@master
        with:
          severity: warning
          ignore_paths: >-
            nightfire-ps2/PCSX2.ini
